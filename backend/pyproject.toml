[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.68",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.3",
    "langchain-text-splitters>=1.1.2",
    "motor>=3.7.1",
    "openai>=2.53.0",
    "openrouter>=1.1.38",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
]

[dependency-groups]
dev = [
    "mongomock-motor>=0.0.36",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
